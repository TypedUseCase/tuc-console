name: Check

on:
  push:
    branches:
      - master
      - main
  pull_request:
  schedule:
    - cron: "0 3 * * *"

jobs:
  build:
    strategy:
      matrix:
        os:
          - name: macos-14
            rid: osx-arm64
            run: ./build.sh
          - name: ubuntu-latest
            rid: linux-x64
            run: ./build.sh
          - name: windows-latest
            rid: win-x64
            run: ./build.cmd
        dotnet: ["10.x"]
    runs-on: ${{ matrix.os.name }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Cache PlantUML
        uses: actions/cache@v4
        with:
          path: tools/plantuml/native
          key: plantuml-native-${{ matrix.os.rid }}-${{ hashFiles('tools/plantuml/manifest.txt') }}
          enableCrossOsArchive: true

      - name: Build
        run: ${{ matrix.os.run }}

  tests:
    strategy:
      matrix:
        os:
          - name: macos-14
            rid: osx-arm64
            run: ./build.sh -t tests no-lint
          - name: ubuntu-latest
            rid: linux-x64
            run: ./build.sh -t tests no-lint
          - name: windows-latest
            rid: win-x64
            run: ./build.cmd -t tests no-lint
        dotnet: ["10.x"]
    runs-on: ${{ matrix.os.name }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Cache PlantUML
        uses: actions/cache@v4
        with:
          path: tools/plantuml/native
          key: plantuml-native-${{ matrix.os.rid }}-${{ hashFiles('tools/plantuml/manifest.txt') }}
          enableCrossOsArchive: true

      - name: Run tests
        run: ${{ matrix.os.run }}
